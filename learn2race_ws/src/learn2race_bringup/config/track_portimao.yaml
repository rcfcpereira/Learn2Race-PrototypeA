# References (full entries: docs/references.md at the repository root):
#   [R1] TrackBotGP rules 2026: Portimao track, Figure 5
# TrackBotGP Portimao (practice track): race settings that depend on the
# layout, over prototype_a.yaml. Select with track:=portimao (the default).
# Follower arguments, read by tools/robot.sh. No bend slowdown: it was added
# for Suzuka after the good runs here (Portimao 2026-10-01 01:46, Monza
# 2026-10-02 01:39) and made Monza twice as slow (2026-10-09: 63/66/33 s).
# robot.sh follower: bend_speed:=0.0
gp_referee:
  ros__parameters:
    pit_side: right             # driven clockwise: pit lane on the right (confirmed 2026-10-01)
    expected_lap_m: 8.1         # nine laps of 8.00-8.15 m on 2026-10-02 (wheel odometry); drawn lap 8.95 m, rope 8.959 m
    min_first_lap_m: 5.4
    pit_arm_before_finish_m: 0.9  # split ~0.5 m before the end of the lap
