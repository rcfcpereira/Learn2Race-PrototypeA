; References (full entries: docs/references.md at the repository root):
;   [R63] ESP32 TRM / Arduino-ESP32 / PlatformIO: PlatformIO, espressif32
;   [R14] micro-ROS / micro_ros_arduino: micro_ros_arduino
; More details: firmware/README.md

[platformio]
default_envs = esp32dev

[env:esp32dev]
; The robot firmware. i2c_diag.cpp is a separate diagnostic program with its own
; setup() and loop(), so it is excluded here and built only by env:diag.
build_src_filter = +<*> -<i2c_diag.cpp> -<wheel_test.cpp>
; Prototype A: Waveshare General Driver for Robots (ESP32) driving two
; CHP-20GP-180ABHL geared motors through the on-board H-bridge, publishing to
; ROS 2 Jazzy through a micro-ROS serial client.
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 921600
upload_speed = 460800

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-jazzy
    ; INA219 voltage and current monitor, fitted on the General Driver board.
    wollewald/INA219_WE

build_flags =
    -L.pio/libdeps/esp32dev/micro_ros_arduino/src/esp32
    -lmicroros
    -D ROS_SERIAL_BAUD=921600

    ; --- Drivetrain -------------------------------------------------------
    ; CHP-20GP-180ABHL, 1:29 planetary gearbox, 11 PPR hall encoder.
    ; Manufacturer datasheet, "Hall signal" row: 320.76 pulses per output
    ; revolution for the 1:29 gearbox. That fixes both constants: 11 PPR, and an
    ; exact reduction of 320.76 / 11 = 29.16 (planetary ratios are not whole
    ; numbers). With x4 quadrature decoding: 1283.04 counts per wheel turn.
    ; Measured by hand-turning each wheel one revolution: 1283 and 1306 counts.
    -D GEAR_RATIO=29.16f
    -D ENCODER_PPR=11
    ; Calibrated 2026-09-28. Straight-line test: real/odometry 0.9786 over
    ; 3 x 2 m (spread 0.3%), so the effective radius is 31.8 mm, not the
    ; nominal 32.5. UMBmark (1 m square, 3+3 runs): alpha -4.34 deg ->
    ; track 0.1755 x 90/94.34 = 0.1674 m; beta -6.16 deg -> E_d = 0.981
    ; (right wheel smaller; the robot drifted right). Per-wheel radii keep the
    ; 31.8 mm mean: left 31.8 x 2/(1+E_d), right 31.8 x 2/(1+1/E_d).
    -D WHEEL_RADIUS_M=0.0318f
    -D LEFT_WHEEL_RADIUS_M=0.03210f
    -D RIGHT_WHEEL_RADIUS_M=0.03150f
    -D TRACK_WIDTH_M=0.1674f

    ; --- Motor drive limit --------------------------------------------------
    ; The datasheet specifies this 1:29 motor at both 6 V (250 rpm no-load) and
    ; 12 V (515 rpm no-load); speed scales with voltage, so it is one motor rated
    ; for either supply. A 3S pack (11.1-12.6 V) is within its rating, and the
    ; earlier cap of 120, set to protect a supposed 6 V motor, limited the robot
    ; to about 45 % of its available speed.
    ;
    ; The limit now protects the H-bridge rather than the motor. Stall current at
    ; 12 V is up to 2.7 A per motor, which exceeds the continuous rating of the
    ; small dual drivers typical on boards of this kind. 200/255 keeps a margin;
    ; raise towards 255 only after confirming the driver chip's continuous
    ; current rating and checking that it stays cool during a stalled start.
    -D MAX_PWM_DUTY=200

    ; Wheel directions. Motor sign: flip if that wheel turns BACKWARDS when the
    ; robot is commanded forward. Encoder sign: flip if the wheel turns the right
    ; way but races to full speed, or if /odom shows rotation when driving
    ; straight. Run the wheel direction test in the README after any change.
    ; Measured with the basic wheel test: on both wheels a "forward" H-bridge
    ; command turns the wheel backwards, and the count falls when the wheel turns
    ; physically forward. All four signs are therefore -1.
    -D LEFT_MOTOR_SIGN=-1
    -D RIGHT_MOTOR_SIGN=-1
    -D LEFT_ENCODER_SIGN=-1
    -D RIGHT_ENCODER_SIGN=-1

    ; --- IMU frame ---------------------------------------------------------
    ; The QMI8658C on this board is oriented x forward, y RIGHT, z DOWN: the
    ; aerospace NED convention, which is usual on flight-controller-derived
    ; hardware. ROS requires x forward, y LEFT, z UP (REP-103).
    ;
    ; The conversion is a 180 degree rotation about x: keep x, negate y and z.
    ; Its determinant is +1, so it is a proper rotation and angular velocity
    ; transforms exactly as linear acceleration does. No extra gyroscope sign
    ; flip is needed, which is why IMU_GYRO_SIGN stays at 1.
    ;
    ;     ROS x (forward)  <-  + sensor x
    ;     ROS y (left)     <-  - sensor y   (sensor y points right)
    ;     ROS z (up)       <-  - sensor z   (sensor z points down)
    ;
    ; Consequence to expect: roll, pitch and yaw all reverse sign relative to
    ; the raw sensor. A positive yaw rate now means turning left, as ROS
    ; requires, where the raw sensor reported positive for turning right.
    -D IMU_X_SOURCE=0
    -D IMU_X_SIGN=1
    -D IMU_Y_SOURCE=1
    -D IMU_Y_SIGN=-1
    -D IMU_Z_SOURCE=2
    -D IMU_Z_SIGN=-1
    -D IMU_GYRO_SIGN=1

    ; --- Pack monitoring ---------------------------------------------------
    ; 3S LiPo. The floor is per cell; below it the pack is being damaged.
    -D BATTERY_CELLS=3
    -D CELL_FLOOR_V=3.50f
    -D CELL_FULL_V=4.20f

[env:esp32dev_pi_sensors]
; Motors, encoders and Grove Chainable RGB remain on the ESP32. Use ONLY after
; wiring the sensor bus to the Pi as its sole master. No Wire.begin, sensor
; reads or sensor publishers are compiled into this profile.
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -L.pio/libdeps/esp32dev_pi_sensors/micro_ros_arduino/src/esp32
    -D ESP32_SENSOR_OWNER=0

[env:diag]
; Standalone I2C diagnostic: no micro-ROS, so the serial port carries plain
; text. Dumps what the IMU, compass and battery monitor actually return.
;   pio run -e diag -t upload
;   pio device monitor -e diag
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<i2c_diag.cpp>

[env:wheels]
; Basic wheel test: raw PWM and raw encoder counts, no micro-ROS, no speed
; controller. Driven from the serial monitor with single keys.
;   pio run -e wheels -t upload
;   pio device monitor -e wheels
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<wheel_test.cpp>
